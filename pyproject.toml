[project]
name = "ai-mates-mcp-server"
version = "0.1.0"
description = "A slim PAL-inspired MCP server for OpenAI, Anthropic, and Gemini"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Peter Souter" }]
dependencies = [
    "anthropic>=0.120.2",
    "google-genai>=2.16.0",
    "mcp>=1.12.0",
    "openai>=2.51.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ai-mates-mcp-server = "ai_mates_mcp_server.server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
